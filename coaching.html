<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="clone/assets/efa-oiseau.png"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les ateliers EFA</title>
<link rel="canonical" href="https://efa.africa/ateliers">
<meta name="robots" content="noindex">
<script>
/* coaching.html devient la page Les ateliers (ateliers.html).
   Les liens qui visent un endroit précis de l'ancienne page (#credits, #gratter, #atelier-…, ?parrain=, ?avis=)
   vont vers ateliers-elysee.html, qui garde les ateliers avec Élysée Johnson, les rendez-vous et les crédits. */
(function(){ var q=location.search, h=location.hash;
  var vers=(h&&h.length>1)||/[?&](parrain|avis)=/.test(q)?'ateliers-elysee.html':'ateliers.html';
  location.replace(vers+q+h); })();
</script>
<meta http-equiv="refresh" content="0; url=ateliers.html">
</head><body><p><a href="ateliers.html">Les ateliers EFA</a></p></body></html>
