name: Historique BRVM (bulletins officiels)

# Lancement manuel : télécharge les bulletins officiels de la cote sur une période
# et en enregistre le texte sur la branche « brvm-historique-brut ».
on:
  schedule:
    - cron: "17 8 * * 6"   # chaque samedi : bulletins des 14 derniers jours (dividendes, détachements)
  workflow_dispatch:
    inputs:
      debut:
        description: "Première séance (AAAA-MM-JJ)"
        default: ""
      fin:
        description: "Dernière séance (AAAA-MM-JJ)"
        default: ""

permissions:
  contents: write

concurrency:
  group: brvm-historique
  cancel-in-progress: false

jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pip install requests
      - name: Préparer la branche
        run: |
          git config user.name "EFA robot BRVM"
          git config user.email "robot-brvm@efa.africa"
          cp scripts/brvm/historique_telecharger.py /tmp/telecharger.py
          if git ls-remote --exit-code --heads origin brvm-historique-brut; then
            git checkout -B brvm-historique-brut origin/brvm-historique-brut
          else
            git checkout --orphan brvm-historique-brut && git rm -rfq . && echo "Texte des bulletins officiels de la cote BRVM (source : brvm.org)" > LISEZ-MOI.md
          fi
      - name: Télécharger les bulletins
        run: python /tmp/telecharger.py --debut "${{ inputs.debut }}" --fin "${{ inputs.fin }}" --sortie brut
      - name: Enregistrer
        if: always()
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Bulletins officiels BRVM ${{ inputs.debut }} → ${{ inputs.fin }}"
          git push origin HEAD:brvm-historique-brut

  dividendes:
    needs: telecharger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Lire les bulletins (dividendes) et refaire l'onglet Marchés
        run: |
          git fetch origin brvm-historique-brut
          mkdir -p /tmp/brut && git archive origin/brvm-historique-brut brut | tar -x -C /tmp/brut --strip-components=1
          python scripts/brvm/historique_lire.py --brut /tmp/brut
          python scripts/brvm/historique_evenements.py --brut /tmp/brut
          python scripts/brvm/historique_titres.py --brut /tmp/brut
          python scripts/brvm/marches.py
      - name: Enregistrer
        run: |
          git config user.name "EFA robot BRVM"
          git config user.email "robot-brvm@efa.africa"
          git add data/brvm data/marches
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "BRVM : dividendes et historique (bulletins officiels)"
          git pull --rebase origin main
          git push origin HEAD:main
