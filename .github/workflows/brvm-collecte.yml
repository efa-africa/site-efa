name: Collecte BRVM

# Chaque jour ouvré après la clôture (heure d'Abidjan = UTC).
# Deuxième passage plus tard au cas où brvm.org publie en retard : une séance n'est jamais enregistrée deux fois.
on:
  schedule:
    - cron: "37 18 * * 1-5"
    - cron: "37 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brvm-donnees
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Relever la séance
        run: python scripts/brvm/collecte.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "EFA robot BRVM"
          git config user.email "robot-brvm@efa.africa"
          git add data/brvm donnees.js
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "BRVM : relevé de la séance"
          git pull --rebase origin main
          git push origin HEAD:main
