name: Synthèse hebdomadaire BRVM

# Chaque samedi matin : synthèse de la semaine écoulée, matière du bulletin « La semaine à la BRVM ».
on:
  schedule:
    - cron: "17 6 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brvm-donnees
  cancel-in-progress: false

jobs:
  synthese:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthèse des 7 derniers jours
        run: python scripts/brvm/semaine.py --jours 7
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "EFA robot BRVM"
          git config user.email "robot-brvm@efa.africa"
          git add data/brvm/syntheses
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "BRVM : synthèse de la semaine"
          git pull --rebase origin main
          git push origin HEAD:main
