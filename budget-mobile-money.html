<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo-efa.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1220">
<title>Budget et mobile money · EFA</title>
<meta name="description" content="Un parcours pratique EFA : pourquoi le mobile money disperse le budget, cinq règles pour ne plus perdre le fil, et le calcul de vos petites sommes.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Éducation Financière Afrique">
<meta property="og:title" content="Budget et mobile money · un parcours pratique EFA">
<meta property="og:description" content="Petits transferts, frais, plusieurs portefeuilles : ne plus perdre le fil de son argent. Gratuit, sans inscription.">
<meta property="og:url" content="https://efa.africa/budget-mobile-money.html">
<meta property="og:image" content="https://efa.africa/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Système visuel : surfaces calmes, filets fins, une seule couleur d'action par écran.
   Charte EFA : bleu nuit, blanc, cyan, corail. */
:root{
  --nuit:#0B1220; --nuit2:#131C2E; --papier:#FAF8F4; --blanc:#FFFFFF; --creme:#F5EFE2;
  --cyan:#6DB8F2; --bleu:#2188D6; --corail:#E44828; --corail2:#F09680;
  --ink:#0B1220; --ink2:#4A5263; --ink3:#7A8293; --filet:rgba(11,18,32,.12); --filet2:rgba(11,18,32,.06);
  --sel:#EEF5FC; --err:#B3261E;
  --f-d:"Libre Baskerville",Baskerville,"Baskerville Old Face",Georgia,"Times New Roman",serif;
  --f:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --gut:max(20px,env(safe-area-inset-left,0px)); --gutR:max(20px,env(safe-area-inset-right,0px));
  --bar-h:84px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html:has(.hero),html:has(.hero) body{background:var(--nuit)}
body{margin:0;background:var(--papier);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--bleu);outline-offset:3px}
[tabindex="-1"]:focus{outline:0}
.col{max-width:720px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutR)}
.col.w{max-width:1040px}

/* Barre du site */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 var(--gutR) 0 var(--gut);background:var(--nuit);color:#fff}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.24em}
.brand img{width:30px;height:30px}
.nav{display:flex;gap:2px}
.nav a{text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.01em;padding:8px 12px;border-radius:4px;white-space:nowrap;color:#D8DEE8}
.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav a.on{color:#fff}
.menu-btn{display:none;background:none;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:8px 14px;min-height:40px;font:600 13px var(--f);letter-spacing:.04em;cursor:pointer}
@media (max-width:1100px){.brand span{display:none}}
@media (max-width:900px){
  .brand span{display:inline;font-size:9.5px;letter-spacing:.16em;line-height:1.3;max-width:13em}
  .nav{position:fixed;inset:0;width:100vw;height:100svh;z-index:40;background:var(--nuit);flex-direction:column;justify-content:center;align-items:flex-start;padding:0 32px;gap:4px;display:none}
  .nav.open{display:flex}
  .nav a{font-size:26px;font-weight:300;letter-spacing:-.01em;white-space:normal;color:#fff;padding:10px 0}
  .menu-btn{display:block;position:relative;z-index:41}
}

/* Éléments communs */
.over{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
.dark .over{color:#8E98AA}
.t1{font-family:var(--f-d);font-weight:700;text-transform:none;line-height:1.12;letter-spacing:-.005em;font-size:clamp(45px,9.5vw,96px);text-wrap:balance}
.t2{font-weight:300;font-size:clamp(28px,5.4vw,44px);line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.t3{font-weight:600;font-size:clamp(19px,2.6vw,22px);line-height:1.3;letter-spacing:-.005em}
.lede{font-size:clamp(17px,2.2vw,20px);line-height:1.55;font-weight:400;color:var(--ink2)}
.small{font-size:13px;color:var(--ink3);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:4px;border:0;font:600 15px/1 var(--f);letter-spacing:.02em;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,opacity .2s}
.btn-c{background:var(--corail);color:#fff}
.btn-c:hover{background:#D23C1F}
.btn-n{background:var(--nuit);color:#fff}
.btn-n:hover{background:#1B2638}
.btn-w{background:#fff;color:var(--nuit)}
.btn-g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--filet)}
.btn-g:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.lien{background:none;border:0;padding:8px 0;font:600 15px/1.5 var(--f);color:var(--ink);cursor:pointer;display:inline;text-align:left;text-decoration:underline;text-decoration-color:var(--filet);text-decoration-thickness:1px;text-underline-offset:6px}
.lien:hover{text-decoration-color:currentColor}
.lien::after{content:"\00a0→"}
.lien.b{color:var(--bleu);text-decoration-color:rgba(33,136,214,.3)}
.dark .lien{color:#fff;text-decoration-color:rgba(255,255,255,.3)}

/* Entrée */
.hero{background:var(--nuit);color:#fff;min-height:min(calc(100svh - 60px),780px);display:flex;align-items:flex-end;padding-block:56px 48px;position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;right:-18vmin;top:-12vmin;width:72vmin;height:72vmin;border-radius:50%;border:1px solid rgba(109,184,242,.16);z-index:-1}
.hero::after{content:"";position:absolute;right:-6vmin;top:0;width:48vmin;height:48vmin;border-radius:50%;border:1px dashed rgba(255,255,255,.08);z-index:-1}
.hero .col{width:100%}
.hero .mission{font-size:13px;color:#8E98AA;max-width:34em;margin-bottom:40px}
.hero .mission .mc{color:#EC6243}.hero .mission .ms{color:var(--cyan)}
.hero .t1{margin-top:14px}
.hero .lede{color:#C9D1DE;margin-top:22px;max-width:30em}
.hero .acts{display:flex;flex-direction:column;align-items:flex-start;gap:18px;margin-top:40px}
.hero .note{margin-top:28px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#8E98AA;letter-spacing:.01em}
.reprise{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-top:36px;padding:16px 18px;border:1px solid rgba(255,255,255,.16);border-radius:6px;max-width:560px}
.reprise b{display:block;font-weight:600;font-size:15px}
.reprise span{font-size:13px;color:#8E98AA}
@media (max-width:560px){.hero .acts .btn{width:100%}}

/* Écrans d'étape */
.screen{min-height:min(calc(100svh - 60px),900px);display:flex;flex-direction:column}
.stage{flex:1;padding-block:28px calc(var(--bar-h) + 40px)}
.prog{display:flex;align-items:center;gap:16px;margin-bottom:44px}
.prog .lbl{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.seg{flex:1;display:grid;gap:4px}
.seg i{display:block;height:2px;background:var(--filet)}
.seg i.on{background:var(--nuit)}
.q-h{display:grid;gap:12px;margin-bottom:28px}
.q-h .small{margin-top:4px}
.opts{border-top:1px solid var(--filet)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;min-height:64px;padding:16px 4px;border:0;border-bottom:1px solid var(--filet);background:none;text-align:left;cursor:pointer;color:var(--ink);font:400 17px/1.4 var(--f);transition:background .15s}
.opt:hover{background:var(--filet2)}
.opt small{display:block;font-size:13px;color:var(--ink3);margin-top:2px}
.opt .ind{flex:none;width:22px;height:22px;border:1.5px solid rgba(11,18,32,.35);border-radius:50%;position:relative;transition:all .15s}
.opt.m .ind{border-radius:4px}
.opt[aria-pressed="true"]{font-weight:600}
.opt[aria-pressed="true"] .ind{background:var(--nuit);border-color:var(--nuit)}
.opt[aria-pressed="true"] .ind::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(250,248,244,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--filet);padding:14px var(--gutR) calc(14px + env(safe-area-inset-bottom,0px)) var(--gut)}
.bar .col{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:0}
.bar .btn{flex:1;max-width:260px}
.bar .btn-g{flex:0 0 auto;max-width:none;padding:0 22px}
@media (min-width:720px){.bar .col{justify-content:flex-end}}

/* Pistes */
.res-h{display:grid;gap:14px;margin-bottom:40px}
.piste{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 24px;padding-block:32px;border-top:1px solid var(--filet)}
.piste .n{font-family:var(--f-d);font-weight:700;font-size:48px;line-height:1.12;color:var(--bleu);letter-spacing:-.01em;min-width:1.4em}
.piste.p1 .n{font-size:88px}
.piste .b{display:grid;gap:10px;min-width:0}
.piste .why{font-size:15px;color:var(--ink2);line-height:1.55}
.piste .why b{font-weight:600;color:var(--ink)}
.piste .act{font-size:16px;line-height:1.6}
.piste.p1 .t2{font-size:clamp(26px,4.6vw,38px)}
.piste .t3{font-size:21px}
.sub-h{padding-top:12px;margin-bottom:-8px}
.first{background:var(--nuit);color:#fff;margin-top:24px;padding:36px 32px;border-radius:2px}
.first .t2{color:#fff;margin-top:12px;font-size:clamp(24px,4.2vw,34px)}
@media (max-width:560px){.first{margin-inline:calc(-1 * var(--gut));padding:32px var(--gut);border-radius:0}.piste{grid-template-columns:minmax(0,1fr);gap:10px}.piste .n{font-size:44px}.piste.p1 .n{font-size:64px}}
.ctx{margin-top:28px;display:grid;gap:10px}
.ctx p{font-size:15px;color:var(--ink2);padding-left:16px;border-left:2px solid var(--cyan)}
.mention{margin-top:28px;font-size:13px;color:var(--ink3)}
.keep{margin-top:20px;padding:20px;border:1px solid var(--filet);border-radius:4px;display:grid;gap:14px;background:var(--blanc)}
.keep .row{display:flex;flex-wrap:wrap;gap:10px}
.toggle{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--nuit);flex:none;margin-top:2px}
.edit{margin-top:36px}

/* Formulaires du bilan */
.block{padding-block:28px;border-top:1px solid var(--filet)}
.block:first-of-type{border-top:0;padding-top:0}
.block > .t3{margin-bottom:6px}
.block > .small{margin-bottom:12px}
.field{padding-block:18px;border-bottom:1px solid var(--filet2);display:grid;gap:8px}
.field:last-child{border-bottom:0}
.field .lab{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.field .lab b{font-weight:600;font-size:16px}
.field .lab .tot{font-size:13px;font-weight:700;color:var(--bleu);white-space:nowrap;font-variant-numeric:tabular-nums}
.field .ex{font-size:13px;color:var(--ink3);line-height:1.5}
.amount{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid rgba(11,18,32,.3);padding-bottom:4px;transition:border-color .15s}
.amount:focus-within{border-color:var(--bleu)}
.amount input{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;font:300 30px/1.2 var(--f);letter-spacing:-.01em;color:var(--ink);padding:4px 0}
.amount input::placeholder{color:#B8BDC7}
.amount input:disabled{color:var(--ink3)}
.amount em{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--ink3)}
.prec{display:inline-flex;flex-wrap:wrap;border:1px solid var(--filet);border-radius:4px;overflow:hidden;align-self:start}
.prec button{min-height:34px;padding:0 12px;border:0;border-right:1px solid var(--filet);background:none;font:600 12px var(--f);letter-spacing:.02em;color:var(--ink2);cursor:pointer}
.prec button:last-child{border-right:0}
.prec button[aria-pressed="true"]{background:var(--nuit);color:#fff}
.mini{background:none;border:0;padding:4px 0;font:600 13px var(--f);color:var(--bleu);cursor:pointer;text-align:left;justify-self:start;min-height:32px}
.lines{display:grid;gap:10px;padding:12px 0 4px}
.line{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 60px 36px;gap:8px;align-items:end}
.line input{min-width:0;width:100%;border:0;border-bottom:1px solid var(--filet);background:none;padding:8px 0;font:400 15px var(--f);outline:0}
.line input:focus{border-color:var(--bleu)}
.line .x{min-height:38px;border:0;background:none;font-size:18px;color:var(--ink3);cursor:pointer}
@media (max-width:480px){.line{grid-template-columns:minmax(0,1fr) 60px 36px}.line .ll{grid-column:1/-1}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
.date{display:grid;gap:6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.date input,.date select{border:0;border-bottom:1.5px solid rgba(11,18,32,.3);background:none;padding:8px 0;font:400 18px var(--f);color:var(--ink);text-transform:none;letter-spacing:0;outline:0;width:100%;min-height:44px;border-radius:0}
.checks{border-top:1px solid var(--filet)}
.chk{display:flex;gap:14px;align-items:flex-start;padding:14px 2px;border-bottom:1px solid var(--filet);cursor:pointer;font-size:16px}
.chk input{width:20px;height:20px;accent-color:var(--nuit);flex:none;margin-top:2px}
.chk small{display:block;font-size:13px;color:var(--ink3)}
.info{font-size:14px;line-height:1.55;color:var(--ink2);padding:14px 16px;background:var(--blanc);border-left:2px solid var(--cyan);margin-block:12px}
.info b{color:var(--ink);font-weight:600}
.info.w{border-color:var(--corail)}
details.grp{border-top:1px solid var(--filet)}
details.grp > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:60px;font-weight:600;font-size:17px}
details.grp > summary::-webkit-details-marker{display:none}
details.grp > summary .s{margin-left:auto;font-size:13px;font-weight:700;color:var(--bleu)}
details.grp > summary::after{content:"";width:9px;height:9px;border:solid var(--ink);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin:0 4px 4px 8px;transition:transform .2s}
details.grp[open] > summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.more{display:flex;flex-wrap:wrap;gap:8px;padding-block:12px}
.more button{min-height:38px;padding:0 14px;border:1px solid var(--filet);border-radius:999px;background:var(--blanc);font:500 13px var(--f);color:var(--ink);cursor:pointer}
.more button::before{content:"+ ";color:var(--bleu);font-weight:700}
.err{font-size:14px;font-weight:600;color:var(--err)}
.total{display:flex;justify-content:space-between;gap:12px;padding-top:16px;font-size:15px;color:var(--ink2)}
.total b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* Bilan */
.ex-band{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;margin-bottom:28px;border-bottom:1px solid var(--filet)}
.ex-band span{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--corail)}
.figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--nuit);border-bottom:1px solid var(--filet);margin-top:8px}
.figs div{padding:18px 14px 18px 0;display:grid;grid-template-rows:minmax(2.8em,auto) auto;align-items:end;gap:6px;min-width:0}
.figs span{align-self:start}
.figs div + div{padding-left:14px;border-left:1px solid var(--filet)}
.figs span{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.figs b{font-weight:300;font-size:clamp(22px,2.6vw,27px);letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.figs .ec b{font-weight:600;color:var(--bleu)}
@media (max-width:640px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}.figs div:nth-child(odd){padding-left:0;border-left:0}.figs div:nth-child(even){padding-left:14px;border-left:1px solid var(--filet)}.figs div{border-bottom:1px solid var(--filet2)}.figs .ec{grid-column:1/-1;padding-left:0!important;border-left:0!important;border-bottom:0}}
.verdict{margin-top:20px;font-size:clamp(18px,2.4vw,21px);line-height:1.5}
.verdict b{font-weight:600}
.bars{display:grid;gap:18px;margin-top:8px}
.br{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:baseline}
.br .l{font-size:15px}
.br .v{font-size:15px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.br .v small{font-weight:400;color:var(--ink3);margin-left:6px}
.br .tr{grid-column:1/-1;height:6px;background:var(--filet2);border-radius:0 3px 3px 0}
.br .tr i{display:block;height:100%;background:var(--bleu);border-radius:0 3px 3px 0;min-width:2px}
.dl{display:grid;grid-template-columns:minmax(0,1fr) auto;border-top:1px solid var(--filet)}
.dl > *{padding:12px 0;border-bottom:1px solid var(--filet2);font-size:15px}
.dl dt{color:var(--ink2)}
.dl dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.act-panel{background:var(--corail);color:#fff;padding:32px;margin-top:8px;border-radius:2px}
.act-panel .over{color:#FFE0D6}
.act-panel .t2{color:#fff;margin-top:10px;font-size:clamp(23px,4vw,32px)}
.act-panel p{margin-top:10px;color:#FFF1EC}
.act-panel .btn{margin-top:22px}
@media (max-width:560px){.act-panel{margin-inline:calc(-1 * var(--gut));padding:28px var(--gut);border-radius:0}}
.r-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
@media (max-width:560px){.r-acts .btn{flex:1 1 100%}}
details.meth{margin-top:36px;border-top:1px solid var(--filet);padding-top:8px}
details.meth summary{cursor:pointer;min-height:52px;display:flex;align-items:center;font-weight:600}
details.meth p,details.meth table{font-size:14px;color:var(--ink2)}
details.meth table{width:100%;border-collapse:collapse;margin-block:12px}
details.meth td,details.meth th{border-top:1px solid var(--filet);padding:10px 8px 10px 0;text-align:left;vertical-align:top}
.recover textarea{width:100%;min-height:140px;font:13px ui-monospace,monospace;border:1px solid var(--filet);padding:10px}
footer{background:var(--nuit);color:#8E98AA;padding-block:24px;font-size:12px;letter-spacing:.02em}
footer .col{display:flex;flex-wrap:wrap;gap:8px 20px}
footer a{color:#D8DEE8;text-decoration:none}
.print-only{display:none}
@media print{
  .top,.bar,footer,.noprint,.hero{display:none!important}
  body{background:#fff;font-size:12pt}
  .screen{min-height:0}.stage{padding:0}
  .first,.act-panel{background:#fff!important;color:#000!important;border:1.5px solid #000}
  .first .t2,.act-panel .t2,.act-panel p{color:#000!important}
  .print-only{display:block;font-size:10pt;color:#333;margin-bottom:12pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Parcours pratique « Prêter à un proche » */
.hero .accroche{margin-top:18px;font-size:15px;color:#8E98AA;max-width:32em}
.story{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:start}

details.mth{border-top:1px solid var(--filet)}

.ms{font-size:14px;color:var(--ink2)}
.mb{display:grid;gap:16px;padding:0 0 24px}

.rep{display:grid;gap:10px;margin-top:4px}

.meth-pick button[aria-pressed="true"]{background:var(--nuit);color:#fff;border-color:var(--nuit)}
.dl dt small{display:block;font-size:13px;color:var(--ink3);font-weight:400}
details.loin{margin-top:28px;border:1px solid var(--nuit);border-radius:2px}
details.loin > summary{cursor:pointer;padding:18px 20px;font-family:var(--f-d);font-weight:700;font-size:clamp(19px,2.6vw,22px);list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.loin > summary::-webkit-details-marker{display:none}
details.loin > summary::after{content:"+";font-family:var(--f);font-size:26px;font-weight:300;color:var(--bleu)}

.lb{display:grid;gap:10px;padding:0 20px 24px}
.lb .t3{margin-top:12px}
.lb p{font-size:16px;line-height:1.65}
.lb a{color:var(--bleu)}
</style>

    ["solde","Le chiffre du dimanche","Le total de toutes vos poches : espèces, mobile money, banque."],
    ["securite","Ne jamais donner son code secret","Ni au téléphone, ni par message, même à quelqu’un qui dit appeler de la part de l’opérateur."]
  ];
  /* Projection : une semaine × 52 / 12 */
  var MOIS=52/12;
  function calc(){
    var p=P(), tr=val("montantTransferts"), fr=val("frais"), ac=val("achats");
    var semaine=(tr||0)+(fr||0)+(ac||0), connu=tr!=null||fr!=null||ac!=null;
    var o={semaine:connu?semaine:null, mois:connu?semaine*MOIS:null, an:connu?semaine*52:null, fraisMois:fr!=null?fr*MOIS:null, transfertsMois:tr!=null?tr*MOIS:null};
    var b=val("budget"); o.part=o.mois!=null&&b?o.mois/b:null; o.budget=b;
    return o;
  }
  var V={};
  V.accueil=function(){
    var reprise=S.etape>1;
    return '<section class="hero dark"><div class="col">'+
      '<p class="over">Apprendre à agir · parcours pratique</p><h1 class="t1" style="margin-top:14px">Budget et mobile money</h1>'+
      '<p class="accroche">Le mobile money a tout rendu plus simple : payer, envoyer, recevoir. Il a aussi rendu l’argent plus facile à perdre de vue.</p>'+
      '<p class="lede">Une situation avec Koffi, ce qui disperse l’argent, cinq règles simples, puis le calcul de vos propres petites sommes.</p>'+
      (reprise?'<div class="reprise"><div><b>Reprendre mon parcours</b><span>Étape '+S.etape+' sur 6</span></div><button type="button" class="btn btn-w" data-act="reprendre">Reprendre</button></div>':'')+
      '<div class="acts"><button type="button" class="btn btn-c" data-act="commencer">Commencer avec Koffi</button><button type="button" class="lien" data-act="direct">Calculer mes petites sommes</button></div>'+
      '<p class="note">Six étapes courtes. Gratuit, sans inscription. Aucun accès à vos comptes : vous saisissez seulement des estimations.</p></div></section>';
  };
  V.e1=function(){
    mesure("mobilemoney_debut");
    return '<section class="screen"><div class="stage col">'+head(1,"La situation","Koffi a perdu la trace de 60&nbsp;000&nbsp;FCFA")+
      '<div class="story"><div class="tx">'+
        '<p>Koffi a fait son budget. Pourtant, le 20 du mois, il ne lui reste presque rien. Il a deux comptes mobile money, un peu d’espèces, et il paie presque tout avec son téléphone.</p>'+
        '<p class="quote">«&nbsp;Je n’ai rien acheté de spécial. Juste des petits transferts, du crédit, un taxi, le repas du midi…&nbsp;»</p>'+
        '<p>En relisant son historique, il trouve&nbsp;: 14 petits envois à des proches, 9 recharges de crédit, 6 retraits avec frais, et une dizaine de paiements chez des commerçants. Rien de grave, mais tout additionné&nbsp;: environ 60&nbsp;000&nbsp;FCFA qu’il n’avait pas prévus.</p>'+
      '</div><img class="ph" src="koffi.jpg" alt="Koffi, le personnage de Min’Fin" width="220" height="293" onerror="this.remove()"></div>'+
      '<div class="facts"><div><span>Petits envois</span><b>14</b></div><div><span>Retraits avec frais</span><b>6</b></div><div><span>Non prévu</span><b>60&nbsp;000</b></div></div>'+
      '<p class="small" style="margin-top:10px">Le mobile money n’est pas en cause : il rend chaque opération facile, donc chaque opération invisible.</p>'+
      '</div>'+barre("accueil","e2","Continuer")+'</section>';
  };
  V.e2=function(){
    return '<section class="screen"><div class="stage col">'+head(2,"À vous","Selon vous, qu’est-ce qui fait le plus disparaître l’argent du mobile money&nbsp;?","Choisissez une ou plusieurs réponses.")+
      choixQ(QUESTIONS)+retours(QUESTIONS,["Chez Koffi","Les petits envois et le crédit téléphonique faisaient plus de la moitié des 60 000 FCFA. Les frais, environ 4 000 FCFA dans le mois."])+
      '</div>'+(S.q2vu&&S.vus.length?barre("e1","e3","Comprendre les enjeux"):barre("e1","voir","Voir ce que ça change",!S.vus.length))+'</section>';
  };
  V.e3=function(){
    return '<section class="screen"><div class="stage col">'+head(3,"Les enjeux","Pourquoi le mobile money disperse le budget","")+
      '<div class="cards4">'+
        '<div><span class="n">01</span><p class="t3">La dispersion</p><p>Deux ou trois portefeuilles, des espèces, parfois une banque&nbsp;: personne ne voit le total. Le budget se perd entre les poches.</p></div>'+
        '<div><span class="n">02</span><p class="t3">Les petites sommes invisibles</p><p>500, 1&nbsp;000, 2&nbsp;000&nbsp;: aucune ne semble compter. Ensemble, elles peuvent représenter une part importante du mois.</p></div>'+
        '<div><span class="n">03</span><p class="t3">Les frais</p><p>Retraits, transferts vers un autre réseau, paiements&nbsp;: les frais sont faibles une fois, réels sur un an. Ils se lisent dans l’historique.</p></div>'+
        '<div><span class="n">04</span><p class="t3">Les transferts entre ses propres poches</p><p>Passer de l’argent d’un compte à l’autre ou le retirer en espèces n’est pas une dépense. Mais si on le compte deux fois, le budget devient faux.</p></div>'+
      '</div>'+
      '<div class="real"><p class="over">Ce qu’il faut savoir chez nous</p><ul>'+
        '<li><b>L’historique est votre relevé.</b> Les applications et les messages de confirmation gardent la trace de chaque opération&nbsp;: c’est la matière première du suivi.</li>'+
        '<li><b>Le numéro est parfois partagé</b> en famille ou avec l’activité. Séparez au moins les usages&nbsp;: un portefeuille pour le foyer, un pour l’activité.</li>'+
        '<li><b>Les demandes arrivent à toute heure</b>, et dire non par téléphone est difficile. Une enveloppe fixée à l’avance permet de répondre sans culpabilité.</li>'+
        '<li><b>Les tarifs changent selon l’opérateur et le type d’opération.</b> Consultez la grille de votre opérateur&nbsp;: payer directement coûte souvent moins cher que retirer.</li>'+
        '<li><b>Les arnaques visent le code secret.</b> Aucun opérateur ne vous le demandera&nbsp;; un faux message «&nbsp;vous avez reçu par erreur&nbsp;» est un signal d’alerte.</li>'+
      '</ul></div>'+
      '</div>'+barre("e2","e4","Voir les règles")+'</section>';
  };
  V.e4=function(){
    return '<section class="screen"><div class="stage col">'+head(4,"La méthode","Cinq règles pour ne plus perdre le fil","")+
      '<div class="meth">'+
        '<div><span class="n">1</span><b>Un portefeuille, une mission</b><p>Attribuez un rôle à chaque poche&nbsp;: l’une pour les dépenses courantes, l’autre pour l’épargne ou l’activité. On ne paie jamais le quotidien avec la poche épargne.</p><p class="kf">son premier compte reçoit le salaire et paie le mois ; le second garde l’épargne, il ne s’en sert pas pour payer.</p></div>'+
        '<div><span class="n">2</span><b>Le relevé de dix minutes, chaque semaine</b><p>Le dimanche, ouvrez l’historique de chaque portefeuille. Classez rapidement&nbsp;: dépenses prévues, petites sommes, frais, transferts entre vos poches. Notez trois totaux.</p><p class="kf">il note : petits envois 9&nbsp;000, crédit 3&nbsp;500, frais 900.</p></div>'+
        '<div><span class="n">3</span><b>Une enveloppe pour les petits transferts</b><p>Fixez un montant mensuel pour les «&nbsp;envoie-moi un peu&nbsp;». Quand l’enveloppe est vide, vous pouvez dire&nbsp;: «&nbsp;Ce mois-ci, j’ai déjà donné ce que je pouvais.&nbsp;»</p><p class="kf">20&nbsp;000&nbsp;FCFA par mois, dans son budget « famille ».</p></div>'+
        '<div><span class="n">4</span><b>Moins de retraits, et payer directement</b><p>Regroupez vos retraits, payez directement chez le commerçant quand c’est possible, achetez un forfait plutôt que des recharges répétées.</p><p class="kf">un retrait par semaine au lieu de six par mois au hasard.</p></div>'+
        '<div><span class="n">5</span><b>Le chiffre du dimanche</b><p>Additionnez toutes vos poches&nbsp;: espèces, chaque portefeuille, la banque. Comparez à la semaine précédente. C’est le seul chiffre qui dit vraiment où vous en êtes.</p><p class="kf">dimanche dernier 84&nbsp;000, aujourd’hui 61&nbsp;000 : 23&nbsp;000 dépensés cette semaine.</p></div>'+
      '</div>'+
      '<p class="info" style="margin-top:20px"><b>Rappel de sécurité&nbsp;:</b> ne communiquez jamais votre code secret, même à quelqu’un qui dit appeler de la part de votre opérateur.</p>'+
      '</div>'+barre("e3","e5","Calculer mes petites sommes")+'</section>';
  };
  V.e5=function(){
    mesure("mobilemoney_situation");
    return '<section class="screen"><div class="stage col">'+head(5,"Votre situation","Vos petites sommes d’une semaine","Ouvrez l’historique de la semaine dernière, ou estimez. Rien n’est envoyé.")+
      '<div class="block">'+nombre("portefeuilles","Combien de portefeuilles mobile money utilisez-vous ?","","portefeuilles")+
        montant("montantTransferts","Petits envois à des proches, sur une semaine","Le total des petites sommes envoyées.")+
        montant("frais","Frais payés sur une semaine","Retraits, transferts, paiements : regardez la ligne « frais » de l’historique.")+
        montant("achats","Crédit, forfaits et petits achats non prévus, sur une semaine","")+
        montant("budget","Votre budget de dépenses du mois (facultatif)","Pour voir la part que représentent ces petites sommes.")+'</div>'+
      '<div class="block" id="res5"></div>'+
      '<div class="block">'+cases("regles",REGLES,"Les règles que vous adoptez","Choisissez-en deux ou trois pour commencer.")+'</div>'+
      '</div>'+barre("e4","e6","Voir ma fiche")+'</section>';
  };
  function res5(){
    var o=calc(), el=document.getElementById("res5"); if(!el) return;
    if(o.semaine==null){ el.innerHTML='<p class="small">Indiquez au moins un montant pour voir le calcul.</p>'; return; }
    el.innerHTML='<p class="over">En direct</p><div class="facts" style="margin-top:10px"><div><span>Une semaine</span><b>'+fmt(o.semaine)+'</b></div><div><span>Un mois</span><b>'+fmt(o.mois)+'</b></div><div><span>Un an</span><b>'+fmt(o.an)+'</b></div></div>'+
      '<p class="small" style="margin-top:10px">En FCFA. Projection simple : une semaine × 52, divisée par 12 pour le mois.'+(o.part!=null?' Soit environ <b>'+pct(o.part)+'</b> de votre budget du mois.':'')+'</p>'+
      (o.fraisMois!=null&&o.fraisMois>0?'<p class="info">Vos frais représenteraient environ <b>'+F(o.fraisMois)+'</b> par mois, soit '+F(o.fraisMois*12)+' sur un an. Regrouper les retraits et payer directement peut les réduire.</p>':'');
  }
  window.majLive=function(){ res5(); };
  window.apresRendu=function(){ res5(); };
  V.e6=function(){
    var p=P(), o=calc(); mesure("mobilemoney_fiche");
    var R=p.regles&&p.regles.length?p.regles:["releve","enveloppe","solde"];
    var actions=R.map(function(r){ var x=REGLES.filter(function(q){return q[0]===r;})[0]; return x?x[1]+" : "+x[2]:""; }).filter(Boolean).slice(0,4);
    if(o.transfertsMois>0&&R.indexOf("enveloppe")>=0) actions.push("Votre enveloppe de petits transferts pourrait démarrer autour de "+F(Math.round(o.transfertsMois/1000)*1000)+" par mois, puis baisser si vous le souhaitez.");
    return '<section class="screen"><div class="stage col">'+head(6,"Ma fiche","Mon mobile money, en bref","")+

      '<div class="fiche"><dl class="dl">'+(p.portefeuilles?'<dt>Portefeuilles utilisés</dt><dd>'+esc(p.portefeuilles)+'</dd>':'')+(o.semaine!=null?'<dt>Petites sommes, par semaine</dt><dd>'+F(o.semaine)+'</dd><dt>Projection par mois</dt><dd>'+F(o.mois)+'</dd><dt>Projection sur un an</dt><dd>'+F(o.an)+'</dd>':'<dt>Petites sommes</dt><dd>à mesurer cette semaine</dd>')+(o.part!=null?'<dt>Part du budget du mois</dt><dd>'+pct(o.part)+'</dd>':'')+'</dl></div>'+
      '<div class="block" style="margin-top:18px"><p class="t3">En bref : mes règles</p><ul class="todo">'+actions.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>'+
      '<div class="r-acts noprint"><button type="button" class="btn btn-n" data-act="copierFiche">Copier ma fiche</button><button type="button" class="btn btn-g" data-act="imprimer">Imprimer ou enregistrer en PDF</button></div><p class="small" id="copie-ok" hidden style="margin-top:8px">Copié.</p>'+
      keep()+
      '<details class="loin"><summary>Aller plus loin : la version approfondie</summary><div class="lb">'+
        '<h2 class="t3">1. Faire son relevé hebdomadaire, pas à pas</h2><p>Ouvrez l’historique du premier portefeuille. Pour chaque ligne, posez une seule question&nbsp;: dépense prévue, petite somme, frais, ou transfert entre mes poches&nbsp;? Faites trois totaux. Recommencez avec chaque portefeuille. Ajoutez les espèces dépensées que vous vous rappelez. Dix minutes suffisent quand on le fait chaque semaine.</p>'+
        '<h2 class="t3">2. Ne pas compter deux fois</h2><p>Retirer 20&nbsp;000 de votre mobile money en espèces n’est pas une dépense&nbsp;: c’est le même argent qui change de poche. La dépense, c’est ce que vous achetez ensuite avec ces espèces. Seuls les frais du retrait sont une dépense.</p>'+
        '<h2 class="t3">3. Organiser ses portefeuilles</h2><p>Le quotidien d’un côté, l’épargne de l’autre&nbsp;; si vous avez une activité, un portefeuille pour elle. Le jour où le salaire ou la recette arrive, faites d’abord le virement vers l’épargne, puis vivez avec le reste&nbsp;: c’est la méthode «&nbsp;payez-vous d’abord&nbsp;» du parcours <a href="construire-son-budget.html?src=mobilemoney">Construire son budget</a>.</p>'+
        '<h2 class="t3">4. Les frais</h2><p>Repérez dans l’historique les opérations qui coûtent le plus&nbsp;: retraits de petits montants, envois vers un autre réseau. Comparez avec la grille officielle de votre opérateur. Souvent, payer directement le commerçant ou la facture coûte moins cher que retirer puis payer en espèces.</p>'+
        '<h2 class="t3">5. Les demandes d’argent par téléphone</h2><p>Fixez votre enveloppe «&nbsp;petits transferts&nbsp;» en début de mois et tenez-vous-y. Pour une demande importante, prenez le temps&nbsp;: le parcours <a href="preter-a-un-proche.html?src=mobilemoney">Prêter à un proche</a> aide à préparer une réponse claire.</p>'+
        '<h2 class="t3">6. La sécurité</h2><p>Code secret jamais partagé, téléphone verrouillé, attention aux messages qui annoncent un envoi «&nbsp;par erreur&nbsp;» et demandent de renvoyer l’argent&nbsp;: vérifiez toujours votre solde réel dans l’application, et contactez votre opérateur par ses canaux officiels.</p>'+
        '<h2 class="t3">7. Le bilan du mois</h2><p>En fin de mois, additionnez vos quatre relevés hebdomadaires et comparez-les à votre budget. Pour un bilan complet, toutes poches comprises, utilisez <a href="ou-est-passe-mon-argent.html?src=mobilemoney">Où est passé mon argent&nbsp;?</a>.</p>'+
      '</div></details>'+
      '<div class="block noprint" style="margin-top:20px"><p class="t3">Pour aller plus loin</p><div class="suite">'+
        '<a href="construire-son-budget.html?src=mobilemoney"><span><b>Construire son budget</b><span>Les méthodes 50/30/20, enveloppes, revenus irréguliers.</span></span><i aria-hidden="true">→</i></a>'+
        '<a href="ou-est-passe-mon-argent.html?src=mobilemoney"><span><b>Où est passé mon argent&nbsp;?</b><span>Le bilan complet de toutes vos poches.</span></span><i aria-hidden="true">→</i></a>'+
        '<a href="outils.html?src=mobilemoney#agir"><span><b>Tous les parcours</b><span>Apprendre à agir.</span></span><i aria-hidden="true">→</i></a>'+
      '</div></div>'+
      '<details class="meth"><summary>Méthode et limites</summary><p>Parcours pédagogique EFA '+VERSION+'. La projection multiplie une semaine par 52, puis divise par 12 : elle donne un ordre de grandeur, pas un relevé exact. EFA n’a accès à aucun de vos comptes et ne recommande aucun opérateur. Vos montants restent dans ce navigateur.</p></details>'+
      '</div>'+barre("e5",null,"")+'</section>';
  };
  function ficheTexte(){
    var p=P(), o=calc(), l=["Budget et mobile money · ma fiche (EFA)",""];
    if(o.semaine!=null) l.push("Petites sommes par semaine : "+F(o.semaine),"Par mois : "+F(o.mois),"Sur un an : "+F(o.an));
    l.push("","Mes règles :"); (p.regles&&p.regles.length?p.regles:["releve","enveloppe","solde"]).forEach(function(r){ l.push("- "+lib(REGLES,r)); });
    l.push("","https://efa.africa/budget-mobile-money.html"); return l.join("\n").replace(/ /g," ");
  }
  charger(); S.mode="accueil"; render(false);
})();
